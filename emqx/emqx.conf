## 众感 Sensemble — EMQX 认证/授权（一机一 Token）
## 适用 EMQX 5.x（镜像 emqx/emqx:5.8）。监听器(1883)/仪表盘(18083) 沿用 schema 默认。
## 设备连接：username = device_id，password = 设备 Token。
## 提醒：x-emqx-secret 必须与后端 .env 的 MQTT_AUTH_SECRET 一致。

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://backend:8000/internal/mqtt/auth"
    headers {
      "content-type" = "application/json"
      "x-emqx-secret" = "change-me-internal"
    }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    pool_size = 8
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  cache { enable = true }
  sources = [
    {
      type = http
      method = post
      url = "http://backend:8000/internal/mqtt/acl"
      headers {
        "content-type" = "application/json"
        "x-emqx-secret" = "change-me-internal"
      }
      body {
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
    }
  ]
}
