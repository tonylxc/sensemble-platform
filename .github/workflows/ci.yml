name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16          # 测试用普通 PG 即可（建表走 create_all，无需 Timescale/PostGIS）
        env:
          POSTGRES_USER: sensemble
          POSTGRES_PASSWORD: sensemble
          POSTGRES_DB: sensemble_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sensemble"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: sensemble
      DB_PASSWORD: sensemble
      DB_NAME: sensemble_test
      MQTT_ENABLED: "false"
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 运行 pytest
        working-directory: backend
        run: pytest -q

  frontend-build:
    name: 前端构建 (vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 构建前端（验证可编译）
        working-directory: frontend/web
        run: |
          npm install
          npm run build
